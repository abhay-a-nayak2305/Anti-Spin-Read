name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  framing-eval:
    name: Framing eval gate (offline corpus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsx scripts/eval-framing.ts

  cluster-eval:
    name: Clustering eval gate (bilingual corpus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsx scripts/eval-cluster.ts

  # Browser smoke suite against the seeded in-memory API (:4321) + Vite (:5173).
  # Mirrors the local `with_server.py` invocation documented in
  # frontend/tests/ui_test.py — the helper isn't available in CI, so the
  # readiness polls are done with curl loops.
  ui:
    name: UI smoke (Playwright, seeded servers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps (seed server runs on tsx)
        working-directory: backend
        run: npm ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright + chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start seeded API server (:4321)
        working-directory: backend
        run: |
          npx tsx scripts/launch-seeded-ui.ts > /tmp/seed-server.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://localhost:4321/api/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:4321/api/health
      - name: Start Vite dev server (:5173)
        working-directory: frontend
        env:
          VITE_API_BASE: http://localhost:4321
        run: |
          npm run dev -- --port 5173 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://localhost:5173 > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS -o /dev/null http://localhost:5173
      - name: Run Playwright UI suite
        env:
          UI_BASE_URL: http://localhost:5173
        run: python frontend/tests/ui_test.py
      - name: Show server logs on failure
        if: failure()
        run: |
          echo "== seed-server.log =="
          tail -n 40 /tmp/seed-server.log || true
          echo "== vite.log =="
          tail -n 40 /tmp/vite.log || true
      - name: Stop servers
        if: always()
        run: pkill -f "launch-seeded-ui|seed-server|vite" || true

  security:
    name: Supply-chain audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit backend
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Audit frontend
        working-directory: frontend
        run: npm audit --audit-level=high

  # Live end-to-end pipeline against real Google News RSS. Kept off PRs:
  # network-dependent, and PR feedback should stay hermetic/fast.
  e2e-live:
    name: Live pipeline e2e (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsx scripts/e2e.ts