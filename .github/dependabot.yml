version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      hono:
        patterns: ["hono", "@hono/*"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      vite:
        patterns: ["vite", "@vitejs/*", "vitest", "oxlint"]
      react:
        patterns: ["react", "react-dom", "@types/react*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"